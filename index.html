<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bump ?v= on favicon/apple-touch when replacing logo so home-screen icons can refresh (see comment in manifest). -->
    <link rel="icon" type="image/png" href="/favicon.png?v=1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e7d32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="IPL Predict" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>IPL Prediction Portal</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var p = localStorage.getItem('ipl-theme-preference');
          if (p === 'system') {
            try {
              localStorage.setItem('ipl-theme-preference', 'light');
            } catch (e2) {}
            p = 'light';
          }
          if (p !== 'light' && p !== 'dark') p = 'dark';
          document.documentElement.setAttribute('data-theme', p);
          var c = localStorage.getItem('ipl-color-preset') || 'pitch';
          document.documentElement.setAttribute('data-color', c);
        } catch (e) {}
      })();
    </script>
    <noscript>Please enable JavaScript to use this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
